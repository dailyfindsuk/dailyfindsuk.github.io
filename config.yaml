# Deal bot settings. Edit this file to change what it looks for.

# How many pins to post per run. The workflow runs 4 times a day,
# so 1 per run = 4 pins a day, a safe pace for a new Pinterest account.
# Raised to 2 on 10 Nov 2026 (8 pins a day). Videos stay at 1 per run.
pins_per_run: 2

# Only post items discounted by at least this much.
min_discount_percent: 30

# eBay seller quality filters (only used if eBay comes back).
min_seller_feedback_percent: 98.0
min_seller_feedback_score: 100

# Price range for posted items, in GBP.
min_price: 10
max_price: 400

# eBay: only new items, Buy It Now, located in the UK.
condition: NEW

# One entry per Pinterest board.
#   board_id       comes from: python dealbot.py --create-boards
#   source         "awin" (official retailer feeds) or "ebay"
#   merchants      Awin shops this board takes products from (whole-word match on the
#                  shop name). Shops you haven't joined yet are simply ignored.
#   include_words  only products whose name contains one of these
#   exclude_words  skip products whose name contains any of these
#   gift: true     always write titles as gifts ("🎁 Gift for him under £30 · 40% off: ...")
#   gift_for       default "for ..." when the product title doesn't say (e.g. "for pet lovers")
#   giftable: false  don't use gift titles in the Nov-Dec gift season
#   full_price_ok  gift boards only: may post full-price gifts (no discount is claimed)
#   include_words_for  word filter for one shop only, e.g. {Rarewaves: [game, ps5]}
# Every Awin feed link (AWIN_FEED_ALL, AWIN_FEED_BEAUTY, ...) is read once per run and
# shared by all boards. Any setting above can be overridden for a single board.
#
# Shops: applied for in Oct 2026. When a shop accepts, add it to your AWIN_FEED_ALL
# Create-a-Feed link (and check it with feedcheck.bat first).

categories:

  # ----- Year-round boards -----

  - name: Home & Kitchen
    source: awin
    board_id: "1113515145309063297"
    hashtags: "#homedeals #kitchen #ukdeals"
    gift_for: "for the home"
    min_discount_percent: 20
    merchants: [Candles Direct, Flowers & Plants, Geepas, Joybuy, Buy Me Once, William Morris, La Redoute, Lights4fun, Starlight Beds, simbasleep, Panda London, Cult Furniture, Meaco, Ebac, BISSELL, DeubaXXL, Living and Home, The Sleep People]
    exclude_words: [replacement, spare, adaptor, refill]

  - name: Tech & Gadgets
    source: awin
    board_id: "1113515145309063302"
    hashtags: "#techdeals #gadgets #ukdeals"
    gift_for: "for tech lovers"
    min_discount_percent: 20
    merchants: [Joybuy, Back Market, Arlo, EE, BISSELL]
    exclude_words: [replacement, spare, adaptor, cable only]

  - name: Gift Ideas
    source: awin
    board_id: "1113515145309063303"
    hashtags: "#giftideas #gifts #ukdeals"
    gift: true
    min_discount_percent: 20
    merchants: [puzzleYOU, Bunches, Masters of Mystery, Cadbury, Hobbies, Virginia Hayward, Buy Me Once, Purr and Mutt, Out n About, Equi London, Rose & Caramel, Tusting, Michael Kors, Bond Touch, Geek Crate, Craftiosity, Craft Buddy, Candles Direct, Flowers & Plants, Bad Shirt Club, WATCH & WATCH, Watch Enclave, Susan Caplan, Angel Barocco]
    # Gift shops often have no sale on. Gift boards may post a full-price gift,
    # worded as "🎁 Gift idea under £35: ..." with no discount claimed.
    full_price_ok: true
    exclude_words: [sample, vial, tester, refill, replacement, spare]

  - name: Gifts for Him
    source: awin
    board_id: "1113515145309154010"
    hashtags: "#giftsforhim #giftsformen #ukdeals"
    gift: true
    gift_for: "for him"
    min_discount_percent: 20
    max_price: 800   # lets good men's watches through
    # Any joined shop, but only products clearly for men.
    include_words: [men, mens, "men's", homme, "pour homme", aftershave, beard, shaving, cologne, "for him", wallet, cufflinks]
    exclude_words: [women, womens, "women's", ladies, femme, sample, vial, tester, refill, replacement]

  - name: Gifts for Her
    source: awin
    board_id: "1113515145309165103"
    hashtags: "#giftsforher #giftideas #ukdeals"
    gift: true
    gift_for: "for her"
    min_discount_percent: 20
    max_price: 800   # lets good watches and jewellery through
    # Any joined shop, but only products clearly for women. Pinterest's audience is
    # mostly women, and "gifts for her" is one of its biggest searches in Nov-Dec.
    include_words: [women, womens, "women's", ladies, femme, "pour femme", "for her", handbag, purse, jewellery, necklace, bracelet, earrings, "vanity case", "make up", makeup, pendant, brooch, bangle, "ladies watch", "womens watch", "women's watch", bouquet, flowers]
    exclude_words: [men, mens, "men's", homme, "pour homme", "for him", sample, vial, tester, refill, replacement]

  - name: Beauty & Fragrance
    source: awin
    board_id: "1113515145309063337"
    hashtags: "#perfume #beautydeals #fragrance"
    min_discount_percent: 25
    min_price: 12
    max_price: 250
    merchants: [Scentsational, Perfume Click, The Beauty Store, Avant, LENA Nail Polish, Cult Beauty, Nails Inc]
    # Skip tiny samples and refills that make poor pins.
    exclude_words: [sample, vial, refill, tester]

  - name: Gym & Fitness
    source: awin
    board_id: "1113515145309063306"
    hashtags: "#homegym #fitness #ukdeals"
    min_discount_percent: 20
    merchants: [Greaves, Gains Nutrition, JTX Fitness, INOV8, Boogie Bounce]

  - name: Car Accessories
    source: awin
    board_id: "1113515145309063309"
    hashtags: "#caraccessories #cars #ukdeals"
    gift_for: "for drivers"
    min_discount_percent: 20
    merchants: [Ottocast]

  - name: Clothes & Trainers
    source: awin
    board_id: "1113515145309063311"
    hashtags: "#fashiondeals #trainers #ukdeals"
    merchants: [La Redoute, Go Outdoors, Schuh, Roman, Oliver Brown, Michael Kors, Surfanic, Bad Shirt Club]

  - name: Pets
    source: awin
    board_id: "1113515145309063313"
    hashtags: "#dogsofpinterest #catlovers #petdeals"
    gift_for: "for pet lovers"
    min_discount_percent: 20
    merchants: [Purr and Mutt, Mersey Raw, Organic Zoo]

  - name: Garden & Outdoor
    source: awin
    board_id: "1113515145309063317"
    hashtags: "#gardenideas #outdoorliving #ukdeals"
    giftable: false
    merchants: [PRC Direct, Bents, Christies Direct, Selections, QUICKPLAY, RattanTree, DeubaXXL, Living and Home]

  - name: DIY & Tools
    source: awin
    board_id: "1113515145309063319"
    hashtags: "#diy #tools #ukdeals"
    gift_for: "for him"
    min_discount_percent: 20
    merchants: [PRC Direct]
    exclude_words: [replacement, spare, blade only]

  - name: Gaming
    source: awin
    board_id: "1113515145309063324"
    hashtags: "#gamingsetup #gaming #ukdeals"
    gift_for: "for gamers"
    min_discount_percent: 20
    merchants: [Rarewaves, EE, Stormforce]
    # Rarewaves also sells music, films and books, so only take its gaming items.
    include_words_for:
      Rarewaves: [ps5, ps4, playstation, xbox, nintendo, switch, game, games, gaming, controller, headset, console]

  - name: Camping & Travel
    source: awin
    board_id: "1113515145309063329"
    hashtags: "#camping #travelessentials #ukdeals"
    gift_for: "for adventurers"
    merchants: [Go Outdoors, Camping World, Case Luggage, Bagsmart, Nere, Jaspacks, Surfanic]

  - name: Anime & Manga
    source: awin
    board_id: "1113515145309154011"
    hashtags: "#anime #animemerch #manga"
    gift_for: "for anime fans"
    min_discount_percent: 20
    merchants: [Rarewaves]
    include_words: [anime, manga, ghibli, "one piece", "demon slayer", "dragon ball", naruto, "jujutsu kaisen", pokemon, "attack on titan", "my hero academia", "spy x family", "chainsaw man"]
    exclude_words: [bootleg, replica, unofficial]

  - name: Baby & Kids
    source: awin
    board_id: "1113515145309063340"
    hashtags: "#babyessentials #kidsdeals #parenting"
    gift_for: "for kids"
    min_discount_percent: 20
    merchants: [PlayPress, Baker Ross, Bedz4kids, Sleeping Stars, QUICKPLAY, The Entertainer, Kiddies Kingdom, Medela]
    exclude_words: [replacement, spare, adaptor]

  # ----- Seasonal boards -----
  # These switch on and off by date and post more often while live
  # (weight 3 = three times as often as a normal board). They pull from every
  # joined shop, matched by words in the product name.

  - name: Halloween
    source: awin
    board_id: "1113515145309154012"
    hashtags: "#halloween #halloweendecor #halloweencostume"
    active_from: "09-15"
    active_until: "10-31"
    weight: 2
    min_discount_percent: 20
    include_words: [halloween, pumpkin, spooky, witch, skeleton, zombie, vampire]

  - name: Christmas Gift Ideas
    source: awin
    board_id: "1113515145309154013"
    hashtags: "#christmasgifts #giftideas #christmas2026"
    active_from: "10-01"
    active_until: "12-23"
    weight: 3
    gift: true
    full_price_ok: true
    min_discount_percent: 20
    include_words: [gift, "gift set", giftset, hamper, "advent calendar", stocking, "selection box", personalised, christmas]
    exclude_words: [tree, wreath, bauble, "gift card", "gift wrap", sample, vial, tester, refill, replacement, "santa maria"]

  - name: Christmas Decor
    source: awin
    board_id: "1113515145309154014"
    hashtags: "#christmasdecor #christmastree #christmas2026"
    active_from: "10-15"
    active_until: "12-20"
    weight: 2
    giftable: false
    min_discount_percent: 20
    include_words: [christmas, xmas, festive, bauble, baubles, wreath, garland, nativity, santa, reindeer, snowman, "fairy lights"]
    # "Santa" also matches brands like Santa Maria Novella, so skip toiletries and perfume.
    exclude_words: [jumper, hamper, chocolate, "gift set", "advent calendar", "santa maria", soap,
                    shampoo, lotion, perfume, parfum, toilette, cologne, cream, candle wax]

  - name: Valentine's Day
    source: awin
    board_id: "1113515145309154015"
    hashtags: "#valentinesday #valentinesgifts #giftsforher"
    active_from: "01-15"
    active_until: "02-14"
    weight: 2
    gift: true
    full_price_ok: true
    min_discount_percent: 20
    include_words: [valentine, valentines, "valentine's", heart, love, couples, romantic, rose, roses]

  - name: Mother's Day
    source: awin
    board_id: "1113515145309154016"
    hashtags: "#mothersday #mothersdaygifts #giftsformum"
    season: mothers_day        # UK Mothering Sunday, moves each year
    season_lead_days: 35
    weight: 2
    gift: true
    full_price_ok: true
    gift_for: "for Mum"
    min_discount_percent: 20
    include_words: [mum, mother, "mother's", women, womens, "women's", ladies, femme, "for her", flowers, bouquet]
    exclude_words: [men, mens, "men's", homme, sample, vial, tester, refill]

  - name: Father's Day
    source: awin
    board_id: "1113515145309154017"
    hashtags: "#fathersday #fathersdaygifts #giftsfordad"
    season: fathers_day        # third Sunday in June
    season_lead_days: 35
    weight: 2
    gift: true
    full_price_ok: true
    gift_for: "for Dad"
    min_discount_percent: 20
    include_words: [dad, father, "father's", men, mens, "men's", homme, aftershave, beard, shaving, "for him"]
    exclude_words: [women, womens, "women's", ladies, femme, sample, vial, tester, refill, replacement]
