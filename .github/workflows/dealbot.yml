name: Deal bot

on:
  schedule:
    # Four times a day (UTC). Odd minutes avoid GitHub's busy top-of-hour slots.
    - cron: "47 7 * * *"
    - cron: "47 11 * * *"
    - cron: "47 16 * * *"
    - cron: "47 19 * * *"
    # Backup times: they only post if a main run above was skipped by GitHub.
    - cron: "17 9 * * *"
    - cron: "17 13 * * *"
    - cron: "17 18 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:   # lets you click "Run workflow" by hand
    inputs:
      dry_run:
        description: "Dry run (find deals, post nothing)"
        type: boolean
        default: false

permissions:
  contents: write      # needed to save state/posted.json back to the repo

concurrency: dealbot

jobs:
  run:
    # Scheduled runs stay off until the repo variable BOT_ENABLED is set to "true"
    # (Settings > Secrets and variables > Actions > Variables). Manual runs always work.
    if: ${{ vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Make sure ffmpeg is available (for YouTube Shorts)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Run bot
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          AWIN_FEED_ALL: ${{ secrets.AWIN_FEED_ALL }}
          AWIN_FEED_GOOGLE: ${{ secrets.AWIN_FEED_GOOGLE }}
          AWIN_FEED_BEAUTY: ${{ secrets.AWIN_FEED_BEAUTY }}
          AWIN_FEED_GAMING: ${{ secrets.AWIN_FEED_GAMING }}
          AWIN_FEED_KIDS: ${{ secrets.AWIN_FEED_KIDS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python dealbot.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save list of posted items
        run: |
          git config user.name "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          git add state/posted.json docs
          git diff --cached --quiet || git commit -m "Update posted items and website"
          git push
