<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Finds UK · TikTok connected</title><meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#0f1714;--card:#17221e;--fg:#eef5f1;--muted:#a7b8b0;--accent:#4fbf9f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:10vh auto;padding:0 16px}
.card{background:var(--card);border-radius:18px;padding:28px}
h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);margin:0 0 18px}
code{display:block;word-break:break-all;background:#0b1210;border:1px solid #2a3a34;border-radius:10px;padding:14px;font-size:15px;color:var(--fg)}
button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#0b1210;font-weight:700;font-size:16px;cursor:pointer}
.err{color:#ff9b8a}
</style></head><body><main><div class="card">
<h1 id="h">Connecting TikTok…</h1>
<p id="msg">One moment.</p>
<code id="code" hidden></code>
<button id="copy" hidden>Copy code</button>
</div></main>
<script>
const q = new URLSearchParams(location.search);
const code = q.get("code"), err = q.get("error_description") || q.get("error");
const h = document.getElementById("h"), msg = document.getElementById("msg");
const box = document.getElementById("code"), btn = document.getElementById("copy");
if (code) {
  h.textContent = "TikTok authorised ✅";
  msg.textContent = "Copy this code and paste it into the Daily Finds window on your PC.";
  box.textContent = code; box.hidden = false; btn.hidden = false;
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(code); btn.textContent = "Copied ✓"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(box);
      getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = "Press Ctrl+C to copy"; }
  };
} else if (err) {
  h.textContent = "TikTok didn't connect"; msg.className = "err"; msg.textContent = err;
} else {
  h.textContent = "Daily Finds UK"; msg.textContent = "This page is used to connect our TikTok account.";
}
</script></body></html>
